name: Draft-release bij nieuwe releasenotities

# Komt er een nieuw bestand RELEASE-NOTES-x.y.z.md op main (zoals Claude doet bij elke versie),
# dan maakt deze workflow een draft-release met tag vx.y.z, titel "Versie x.y.z" en die tekst.
# Bestaat de draft al (en is hij nog niet gepubliceerd), dan wordt alleen de tekst bijgewerkt.
# De tag wordt pas echt aangemaakt als de draft gepubliceerd wordt.
# Daarna hoef je alleen nog het .exe-bestand in de draft te slepen en op Publish te klikken
# (of te wachten op de geplande release van vrijdag; die publiceert nooit zonder .exe).
on:
  push:
    branches: [main]
    paths: ["RELEASE-NOTES-*.md"]
  workflow_dispatch:
    inputs:
      versie:
        description: "Versie, bijvoorbeeld 0.5.22.1 (leeg = de nieuwste releasenotities)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft maken
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIE: ${{ inputs.versie }}
        run: |
          set -euo pipefail
          if [ -z "${VERSIE:-}" ]; then
            VERSIE=$(ls RELEASE-NOTES-*.md | sed -E 's/RELEASE-NOTES-(.*)\.md/\1/' | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n | tail -1)
          fi
          TAG="v$VERSIE"
          NOTES="RELEASE-NOTES-$VERSIE.md"
          [ -f "$NOTES" ] || { echo "::error::$NOTES bestaat niet."; exit 1; }
          tail -n +2 "$NOTES" | sed '1{/^$/d}' > body.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              gh release edit "$TAG" --notes-file body.md
              echo "De draft voor $TAG bestond al; de tekst is bijgewerkt met de nieuwste releasenotities."
            else
              echo "Release $TAG is al gepubliceerd. Niets te doen."
            fi
            exit 0
          fi
          gh release create "$TAG" --draft --target main --title "Versie $VERSIE" --notes-file body.md
          echo "Draft-release $TAG gemaakt. Sleep nu het .exe-bestand erin."
