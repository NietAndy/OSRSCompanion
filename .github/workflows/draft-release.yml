name: Draft-release bij een nieuwe tag

# Push je (of Claude) een tag zoals v0.5.22.1, dan maakt deze workflow een draft-release
# met de titel "Versie 0.5.22.1" en de tekst uit RELEASE-NOTES-0.5.22.1.md.
# Daarna hoef je alleen nog het .exe-bestand in de draft te slepen en op Publish te klikken
# (of te wachten op de geplande release van vrijdag).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft maken
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSIE="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Er bestaat al een release voor $TAG. Niets te doen."
            exit 0
          fi
          NOTES="RELEASE-NOTES-$VERSIE.md"
          if [ -f "$NOTES" ]; then
            tail -n +2 "$NOTES" | sed '1{/^$/d}' > body.md
          else
            echo "Releasenotities volgen." > body.md
            echo "::warning::$NOTES niet gevonden; de draft heeft een lege tekst."
          fi
          gh release create "$TAG" --draft --verify-tag --title "Versie $VERSIE" --notes-file body.md
          echo "Draft-release $TAG gemaakt. Sleep nu het .exe-bestand erin."
