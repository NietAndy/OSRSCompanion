name: Discord changelog

# Zodra je op GitHub een release publiceert, komen de releasenotities in #changelog op Discord.
on:
  release:
    types: [published]
  workflow_dispatch:   # knop "Run workflow", om de koppeling te testen

jobs:
  discord:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Bericht naar Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          NAME: ${{ github.event.release.name || 'Testbericht' }}
          TAG: ${{ github.event.release.tag_name || 'test' }}
          URL: ${{ github.event.release.html_url || format('https://github.com/{0}/releases', github.repository) }}
          BODY: ${{ github.event.release.body || 'Dit is een testbericht. Als je dit in #changelog ziet, werkt de koppeling.' }}
        run: python3 .github/scripts/discord.py
