name: Discord changelog

# Zodra je op GitHub een release publiceert, komen de releasenotities in #changelog op Discord.
on:
  release:
    types: [published]
  workflow_dispatch:   # knop "Run workflow": post de notities van een versie uit de repo
    inputs:
      versie:
        description: "Versie, bijvoorbeeld 0.5.8 (leeg = de nieuwste)"
        required: false
        default: ""

jobs:
  discord:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Bericht naar Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          NAME: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url || format('https://github.com/{0}/releases', github.repository) }}
          VERSIE: ${{ github.event.inputs.versie }}
          ROL: ${{ secrets.DISCORD_ROLE_ID }}   # optioneel: het ID van de rol die je wilt taggen
          BODY: ${{ github.event.release.body }}
        run: python3 .github/scripts/discord.py
