name: Geplande release

# Publiceert automatisch de nieuwste draft-release (geen pre-release).
#  - Eenmalig vandaag, 24 oktober 2026, om 19:15 Nederlandse tijd (zomertijd, UTC+2): 17:15 UTC.
#  - Daarna elke dag om 18:00 UTC. Dat is 19:00 in de wintertijd en 20:00 in de zomertijd.
# Er is geen draft? Dan gebeurt er niets. Is de draft niet compleet? Dan publiceert hij niet en wordt de run rood.
on:
  schedule:
    - cron: "15 17 24 10 *"
    - cron: "0 18 * * *"
  workflow_dispatch:      # knop "Run workflow": publiceert de draft meteen
    inputs:
      tag:
        description: "Tag van de draft, bijvoorbeeld v0.5.15.2 (leeg = de nieuwste draft)"
        required: false
        default: ""

permissions:
  contents: write   # release publiceren en de tag aanmaken
  actions: write    # de Discord-workflow starten

jobs:
  publiceer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controleer en publiceer de draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          releases=$(gh api "repos/$REPO/releases?per_page=100")

          if [ -n "$TAG" ]; then
            # Een bepaalde tag is opgegeven (handmatige run)
            release=$(jq -c --arg t "$TAG" '[.[] | select(.tag_name == $t)] | first // empty' <<<"$releases")
            if [ -z "$release" ]; then
              echo "::error::Geen release met tag $TAG gevonden."
              exit 1
            fi
            if [ "$(jq -r '.draft' <<<"$release")" != "true" ]; then
              echo "Release $TAG is al gepubliceerd. Niets te doen."
              exit 0
            fi
          else
            # Geen tag opgegeven: pak de nieuwste draft die geen pre-release is
            release=$(jq -c '[.[] | select(.draft == true and .prerelease == false)] | sort_by(.created_at) | last // empty' <<<"$releases")
            if [ -z "$release" ]; then
              echo "Geen draft-release gevonden. Niets te doen."
              exit 0
            fi
          fi

          TAG=$(jq -r '.tag_name' <<<"$release")
          VERSIE="${TAG#v}"
          echo "Draft gevonden: $TAG"

          # Veiligheidscheck 1: het programma (een .exe-bestand) zit bij de draft
          if ! jq -e '.assets | any(.name | test("\\.exe$"; "i"))' <<<"$release" >/dev/null; then
            echo "::error::Er zit geen .exe-bestand bij de draft $TAG. Niet gepubliceerd. Voeg het bestand toe en start deze workflow met Run workflow."
            exit 1
          fi

          # Veiligheidscheck 2: de releasenotities staan op main (anders post Discord de notes van een oudere versie)
          if [ ! -f "RELEASE-NOTES-$VERSIE.md" ]; then
            echo "::error::RELEASE-NOTES-$VERSIE.md staat niet op $BRANCH. Niet gepubliceerd. Zet het bestand op $BRANCH en start deze workflow met Run workflow."
            exit 1
          fi

          # Publiceren: de tag wordt nu aangemaakt op de dan actuele main
          gh api -X PATCH "repos/$REPO/releases/$(jq -r '.id' <<<"$release")" \
            -F draft=false -f make_latest=true >/dev/null
          echo "Release $TAG gepubliceerd."

          # Een release die met het standaard token gepubliceerd wordt, start de Discord-workflow niet vanzelf. Dus doen we dat hier zelf.
          gh workflow run discord-changelog.yml --ref "$BRANCH" -f versie="$VERSIE"
          echo "Discord-workflow gestart voor versie $VERSIE."
